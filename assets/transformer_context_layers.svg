<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="760" viewBox="0 0 1450 760" role="img" aria-labelledby="title desc">
  <title id="title">Stylized transformer layers refine token meaning using context</title>
  <desc id="desc">The sentence John wants his bank to cash the check is shown as tokens. Earlier layers identify local grammatical roles. Later layers resolve context such as his referring to John, bank meaning a financial institution, and cash being used as a verb.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#6c8ebf"/>
    </marker>
    <marker id="attention" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#b08d57"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#041e42" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1450" height="760" rx="28" fill="#f7f9fc"/>
  <text x="725" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#041e42">Successive layers build a more context-specific representation</text>
  <text x="725" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526d82">Stylized illustration—not a literal map of any one model</text>

  <rect x="34" y="112" width="1382" height="170" rx="22" fill="#edf3fb" stroke="#6c8ebf" stroke-width="2"/>
  <rect x="34" y="310" width="1382" height="170" rx="22" fill="#ffffff" stroke="#b7c8dd" stroke-width="2"/>
  <rect x="34" y="508" width="1382" height="170" rx="22" fill="#edf3fb" stroke="#6c8ebf" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="34" y="112" width="212" height="170" rx="22" fill="#041e42"/>
    <text x="140" y="178" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">Later layers</text>
    <text x="140" y="215" text-anchor="middle" font-size="21" fill="#ffffff">contextual meaning</text>

    <rect x="34" y="310" width="212" height="170" rx="22" fill="#365f91"/>
    <text x="140" y="376" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">Earlier layers</text>
    <text x="140" y="413" text-anchor="middle" font-size="21" fill="#ffffff">local patterns</text>

    <rect x="34" y="508" width="212" height="170" rx="22" fill="#041e42"/>
    <text x="140" y="574" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">Input</text>
    <text x="140" y="611" text-anchor="middle" font-size="21" fill="#ffffff">tokens</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <g fill="#ffffff" stroke="#6c8ebf" stroke-width="2.5">
      <rect x="275" y="550" width="125" height="82" rx="16"/>
      <rect x="415" y="550" width="135" height="82" rx="16"/>
      <rect x="565" y="550" width="110" height="82" rx="16"/>
      <rect x="690" y="550" width="125" height="82" rx="16"/>
      <rect x="830" y="550" width="90" height="82" rx="16"/>
      <rect x="935" y="550" width="125" height="82" rx="16"/>
      <rect x="1075" y="550" width="100" height="82" rx="16"/>
      <rect x="1190" y="550" width="145" height="82" rx="16"/>
    </g>
    <g font-size="26" font-weight="700" fill="#041e42" text-anchor="middle">
      <text x="337.5" y="601">John</text>
      <text x="482.5" y="601">wants</text>
      <text x="620" y="601">his</text>
      <text x="752.5" y="601">bank</text>
      <text x="875" y="601">to</text>
      <text x="997.5" y="601">cash</text>
      <text x="1125" y="601">the</text>
      <text x="1262.5" y="601">check</text>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <g fill="#ffffff" stroke="#9fb3c8" stroke-width="2">
      <rect x="275" y="349" width="125" height="92" rx="16"/>
      <rect x="415" y="349" width="135" height="92" rx="16"/>
      <rect x="565" y="349" width="110" height="92" rx="16"/>
      <rect x="690" y="349" width="125" height="92" rx="16"/>
      <rect x="830" y="349" width="90" height="92" rx="16"/>
      <rect x="935" y="349" width="125" height="92" rx="16"/>
      <rect x="1075" y="349" width="100" height="92" rx="16"/>
      <rect x="1190" y="349" width="145" height="92" rx="16"/>
    </g>
    <g fill="#334e68" text-anchor="middle">
      <text x="337.5" y="386" font-size="19" font-weight="700">person</text>
      <text x="337.5" y="414" font-size="17">proper noun</text>
      <text x="482.5" y="386" font-size="19" font-weight="700">desire</text>
      <text x="482.5" y="414" font-size="17">verb</text>
      <text x="620" y="386" font-size="19" font-weight="700">possessive</text>
      <text x="620" y="414" font-size="17">pronoun</text>
      <text x="752.5" y="386" font-size="19" font-weight="700">ambiguous</text>
      <text x="752.5" y="414" font-size="17">noun</text>
      <text x="875" y="386" font-size="19" font-weight="700">infinitive</text>
      <text x="875" y="414" font-size="17">marker</text>
      <text x="997.5" y="386" font-size="19" font-weight="700">ambiguous</text>
      <text x="997.5" y="414" font-size="17">noun / verb</text>
      <text x="1125" y="398" font-size="19" font-weight="700">article</text>
      <text x="1262.5" y="386" font-size="19" font-weight="700">ambiguous</text>
      <text x="1262.5" y="414" font-size="17">noun / verb</text>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <g fill="#ffffff" stroke="#365f91" stroke-width="2.5">
      <rect x="405" y="157" width="265" height="82" rx="16"/>
      <rect x="730" y="157" width="285" height="82" rx="16"/>
      <rect x="1075" y="157" width="260" height="82" rx="16"/>
    </g>
    <g fill="#041e42" text-anchor="middle">
      <text x="537.5" y="190" font-size="22" font-weight="700">“his” refers to John</text>
      <text x="537.5" y="218" font-size="17">reference resolved</text>

      <text x="872.5" y="190" font-size="22" font-weight="700">bank = financial institution</text>
      <text x="872.5" y="218" font-size="17">not a riverbank</text>

      <text x="1205" y="190" font-size="22" font-weight="700">cash = action</text>
      <text x="1205" y="218" font-size="17">verb, not money</text>
    </g>
  </g>

  <g stroke="#6c8ebf" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="337.5" y1="548" x2="337.5" y2="447"/>
    <line x1="482.5" y1="548" x2="482.5" y2="447"/>
    <line x1="620" y1="548" x2="620" y2="447"/>
    <line x1="752.5" y1="548" x2="752.5" y2="447"/>
    <line x1="875" y1="548" x2="875" y2="447"/>
    <line x1="997.5" y1="548" x2="997.5" y2="447"/>
    <line x1="1125" y1="548" x2="1125" y2="447"/>
    <line x1="1262.5" y1="548" x2="1262.5" y2="447"/>

    <line x1="620" y1="347" x2="537.5" y2="245"/>
    <line x1="752.5" y1="347" x2="872.5" y2="245"/>
    <line x1="997.5" y1="347" x2="1205" y2="245"/>
  </g>

  <g stroke="#b08d57" stroke-width="4" fill="none" stroke-dasharray="9 8" marker-end="url(#attention)">
    <path d="M337.5 540 C390 500, 525 500, 610 449"/>
    <path d="M482.5 540 C650 505, 825 505, 982 449"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="360" y="470" width="560" height="34" rx="17" fill="#fff7e6" stroke="#d2b06c" stroke-width="1.5"/>
    <text x="640" y="493" text-anchor="middle" font-size="17" font-weight="700" fill="#8a6d3b">Attention lets relevant tokens share information</text>
  </g>
</svg>
